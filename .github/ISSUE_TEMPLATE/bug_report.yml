name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't attach personal files or screenshots showing private file names.**
        For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put a file named `example.pdf` in the folder
        2. Click Organize
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tucklane version
      placeholder: "0.1.0 (Settings › About)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Settings › About › Export diagnostics creates a report without file names. Paste relevant parts here.
