[package]
name = "tucklane"
version = "0.1.0"
description = "A privacy-first downloads organizer for Windows."
authors = ["Shahzaib Anwar <shahzaib@dareecha.pk>"]
homepage = "https://github.com/ShahzaibAnwar/tucklane"
license = "MIT"
repository = "https://github.com/ShahzaibAnwar/tucklane"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tucklane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Tucklane"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8.2"
sha2 = "0.10"
hex = "0.4"
trash = "5.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
base64 = "0.22"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
